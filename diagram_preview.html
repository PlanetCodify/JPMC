<title>Diagram Preview</title>
<style>
  :root {
    --paper: #F1F4F7; --surface: #FFFFFF; --surface-2: #F7F9FB;
    --ink: #12161C; --ink-muted: #5B6675; --ink-faint: #8A93A1;
    --border: #D7DEE6; --border-strong: #C1CAD4;
    --accent: #0E6B63; --accent-ink: #084A44;
    --accent-soft: #E4F1EF; --accent-soft-border: #BFE0DB;
    --good: #2E8B57; --good-soft: #E7F4EC;
    --warn: #9C6B0B; --warn-soft: #FBF1DD;
    --crit: #B23A2E; --crit-soft: #FBEAE7;
    --serif: ui-serif, Georgia, serif;
    --sans: -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0A0E13; --surface: #121821; --surface-2: #0E141C;
      --ink: #E8EDF2; --ink-muted: #98A3B3; --ink-faint: #6B7889;
      --border: #232C38; --border-strong: #2E3947;
      --accent: #45C2B4; --accent-ink: #B7ECE3;
      --accent-soft: #10302C; --accent-soft-border: #1C4941;
      --good: #4CAF7D; --good-soft: #123322;
      --warn: #D8A93B; --warn-soft: #362A0E;
      --crit: #E0776C; --crit-soft: #3A1D19;
    }
  }
  body { background: var(--paper); margin: 0; padding: 40px; font-family: var(--sans); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 32px; max-width: 1080px; }
  h2 { color: var(--ink); font-family: var(--serif); }
</style>
<div class="card">
  <h2>Architecture v3</h2>
  <svg viewBox="0 0 940 580" style="width:100%;height:auto;font-family:var(--sans);">
    <defs>
      <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--ink-muted)"/></marker>
      <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--good)"/></marker>
      <marker id="aw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--warn)"/></marker>
      <marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--crit)"/></marker>
      <marker id="af" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--ink-faint)"/></marker>
      <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink-faint)" stroke-width="1.4" opacity="0.35"/>
      </pattern>
    </defs>

    <!-- in-scope boundary -->
    <rect x="180" y="18" width="745" height="470" rx="8" fill="none" stroke="var(--border-strong)" stroke-width="1.3" stroke-dasharray="6,4"/>
    <text x="196" y="36" font-size="10" font-weight="700" letter-spacing="0.06em" fill="var(--ink-faint)">ICB TRUST PLATFORM &#8212; IN SCOPE</text>

    <!-- Engineer (external actor) -->
    <rect x="10" y="115" width="150" height="52" rx="6" fill="var(--surface-2)" stroke="var(--border-strong)"/>
    <text x="85" y="137" text-anchor="middle" font-size="12.5" fill="var(--ink)">Market Engineer</text>
    <text x="85" y="153" text-anchor="middle" font-size="10" fill="var(--ink-muted)">submits feature</text>
    <text x="10" y="105" font-size="9" fill="var(--ink-faint)">EXTERNAL ACTOR</text>

    <!-- Sandbox -->
    <rect x="200" y="150" width="150" height="40" rx="6" fill="none" stroke="var(--border-strong)" stroke-dasharray="4,3"/>
    <text x="275" y="174" text-anchor="middle" font-size="10.5" fill="var(--ink-muted)">Docs + Sandbox</text>

    <line x1="160" y1="141" x2="196" y2="141" stroke="var(--ink-muted)" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- Tiering API -->
    <rect x="200" y="65" width="160" height="62" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/>
    <text x="280" y="90" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">Tiering API</text>
    <text x="280" y="106" text-anchor="middle" font-size="10" fill="var(--ink-muted)">versioned contract</text>

    <line x1="360" y1="96" x2="400" y2="96" stroke="var(--ink-muted)" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="362" y="86" font-size="8.5" fill="var(--ink-faint)">sync &#183; P50 &lt;2s / P95 &lt;10s</text>

    <!-- Classifier -->
    <rect x="400" y="55" width="180" height="82" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="490" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="var(--accent-ink)">Classifier Engine</text>
    <text x="490" y="101" text-anchor="middle" font-size="10" fill="var(--accent-ink)">Tier 1 / 2 / 3 decision</text>
    <text x="490" y="120" text-anchor="middle" font-size="9.5" fill="var(--accent-ink)" opacity="0.85">ambiguous or down &#8594; Tier 2</text>

    <!-- three branches -->
    <line x1="580" y1="70" x2="630" y2="35" stroke="var(--good)" stroke-width="1.5" marker-end="url(#ag)"/>
    <text x="586" y="52" font-size="8.5" fill="var(--good)">sync, low risk</text>
    <line x1="580" y1="96" x2="630" y2="118" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#aw)"/>
    <text x="586" y="108" font-size="8.5" fill="var(--warn)">sync, medium risk</text>
    <line x1="580" y1="122" x2="630" y2="232" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#ac)"/>
    <text x="586" y="150" font-size="8.5" fill="var(--crit)">async (queued), high risk</text>

    <!-- Tier 1 -->
    <rect x="630" y="10" width="280" height="46" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
    <text x="650" y="29" font-size="11.5" font-weight="700" fill="var(--good)">TIER 1</text>
    <text x="650" y="45" font-size="11" fill="var(--ink)">Automated policy check &#8594; auto-approved</text>

    <!-- Tier 2 -->
    <rect x="630" y="94" width="280" height="46" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
    <text x="650" y="113" font-size="11.5" font-weight="700" fill="var(--warn)">TIER 2</text>
    <text x="650" y="129" font-size="11" fill="var(--ink)">Policy check + logged, sampled later</text>

    <line x1="770" y1="140" x2="770" y2="168" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#aw)"/>
    <rect x="630" y="168" width="280" height="38" rx="6" fill="var(--surface-2)" stroke="var(--border-strong)"/>
    <text x="770" y="191" text-anchor="middle" font-size="10.5" fill="var(--ink-muted)">Periodic human spot-check (sample)</text>

    <!-- Tier 2 sample log -> audit store -->
    <path d="M 630 187 H 560 V 435" fill="none" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#aw)"/>
    <text x="565" y="300" font-size="8" fill="var(--warn)" transform="rotate(90 565 300)" text-anchor="middle">sample log</text>

    <!-- Tier 3 -->
    <rect x="630" y="232" width="280" height="46" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
    <text x="650" y="251" font-size="11.5" font-weight="700" fill="var(--crit)">TIER 3</text>
    <text x="650" y="267" font-size="11" fill="var(--ink)">Full review required, no auto-path</text>

    <line x1="770" y1="278" x2="770" y2="306" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#ac)"/>
    <rect x="630" y="306" width="280" height="40" rx="6" fill="var(--surface)" stroke="var(--crit)" stroke-width="1.5"/>
    <text x="770" y="330" text-anchor="middle" font-size="11" fill="var(--ink)">MRGR Escalation Queue</text>

    <!-- MRGR queue full record -> audit store -->
    <path d="M 630 326 H 560 V 435" fill="none" stroke="var(--crit)" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ac)"/>
    <text x="590" y="380" font-size="8" fill="var(--crit)">full record</text>

    <line x1="900" y1="346" x2="900" y2="365" stroke="var(--crit)" stroke-width="1.5"/>
    <line x1="900" y1="365" x2="820" y2="365" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#ac)"/>
    <text x="700" y="360" text-anchor="middle" font-size="8.5" fill="var(--crit)">escalation package: request + reasoning + audit trail</text>

    <!-- Existing MRGR Review Process : external, hatched -->
    <rect x="610" y="374" width="320" height="60" rx="6" fill="url(#hatch)" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <rect x="610" y="374" width="320" height="60" rx="6" fill="var(--surface)" opacity="0.55"/>
    <text x="770" y="397" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">Existing MRGR Review Process</text>
    <text x="770" y="413" text-anchor="middle" font-size="9.5" fill="var(--ink-muted)">EXTERNAL &#8212; not built by this platform, already exists at JPMC</text>

    <!-- Audit trail (cylinder / data store shape) -->
    <ellipse cx="450" cy="435" rx="130" ry="12" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/>
    <rect x="320" y="435" width="260" height="55" fill="var(--surface)" stroke="none"/>
    <line x1="320" y1="435" x2="320" y2="490" stroke="var(--border-strong)" stroke-width="1.5"/>
    <line x1="580" y1="435" x2="580" y2="490" stroke="var(--border-strong)" stroke-width="1.5"/>
    <path d="M 320 490 A 130 12 0 0 0 580 490" fill="none" stroke="var(--border-strong)" stroke-width="1.5"/>
    <text x="450" y="460" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">Audit Trail Store</text>
    <text x="450" y="476" text-anchor="middle" font-size="9" fill="var(--ink-muted)">reasoning, inputs, reviewer, timestamp</text>

    <!-- legend -->
    <g transform="translate(196,505)">
      <rect x="0" y="0" width="15" height="15" rx="3" fill="var(--good-soft)" stroke="var(--good)"/>
      <text x="21" y="12" font-size="10" fill="var(--ink-muted)">Tier 1, low risk</text>
      <rect x="140" y="0" width="15" height="15" rx="3" fill="var(--warn-soft)" stroke="var(--warn)"/>
      <text x="161" y="12" font-size="10" fill="var(--ink-muted)">Tier 2, medium risk</text>
      <rect x="320" y="0" width="15" height="15" rx="3" fill="var(--crit-soft)" stroke="var(--crit)"/>
      <text x="341" y="12" font-size="10" fill="var(--ink-muted)">Tier 3, high risk</text>
      <rect x="490" y="0" width="15" height="15" rx="3" fill="url(#hatch)" stroke="var(--ink-faint)" stroke-dasharray="3,2"/>
      <text x="511" y="12" font-size="10" fill="var(--ink-muted)">External, already exists</text>
    </g>
  </svg>
</div>

<div class="card">
  <h2>User Flow v3</h2>
  <svg viewBox="0 0 1060 600" style="width:100%;height:auto;font-family:var(--sans);">
    <defs>
      <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--ink-muted)"/></marker>
      <marker id="fg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--good)"/></marker>
      <marker id="fw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--warn)"/></marker>
      <marker id="fc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--crit)"/></marker>
      <pattern id="hatch2" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink-faint)" stroke-width="1.4" opacity="0.35"/>
      </pattern>
    </defs>

    <!-- lanes -->
    <rect x="0" y="20" width="1060" height="120" fill="var(--surface-2)"/>
    <rect x="0" y="140" width="1060" height="190" fill="var(--surface)"/>
    <rect x="0" y="330" width="1060" height="230" fill="var(--surface-2)"/>
    <line x1="0" y1="140" x2="1060" y2="140" stroke="var(--border)"/>
    <line x1="0" y1="330" x2="1060" y2="330" stroke="var(--border)"/>
    <line x1="290" y1="330" x2="290" y2="550" stroke="var(--border-strong)" stroke-dasharray="3,3"/>
    <line x1="650" y1="330" x2="650" y2="550" stroke="var(--border-strong)" stroke-dasharray="3,3"/>

    <text x="14" y="38" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="var(--ink-faint)">ENGINEER</text>
    <text x="14" y="158" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="var(--ink-faint)">TIERING SYSTEM (built by this platform)</text>
    <text x="14" y="348" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="var(--ink-faint)">REVIEW &amp; COMPLIANCE</text>
    <text x="45" y="365" font-size="9" fill="var(--ink-faint)">async sample QA</text>
    <text x="335" y="365" font-size="9" fill="var(--ink-faint)">built by this platform</text>
    <text x="700" y="365" font-size="9" fill="var(--ink-faint)">EXTERNAL &#8212; MRGR's existing process</text>

    <!-- start -->
    <rect x="30" y="60" width="200" height="42" rx="21" fill="var(--accent)" />
    <text x="130" y="85" text-anchor="middle" font-size="11.5" fill="var(--surface)" font-weight="600">Submit feature description</text>
    <line x1="130" y1="102" x2="130" y2="170" stroke="var(--ink-muted)" stroke-width="1.5" marker-end="url(#fa)"/>

    <!-- self-serve status, off to the side -->
    <rect x="260" y="60" width="170" height="42" rx="21" fill="none" stroke="var(--border-strong)" stroke-dasharray="4,3"/>
    <text x="345" y="80" text-anchor="middle" font-size="9.5" fill="var(--ink-muted)">Check status</text>
    <text x="345" y="93" text-anchor="middle" font-size="8" fill="var(--ink-faint)">self-serve, anytime</text>
    <path d="M 260 81 H 200" fill="none" stroke="var(--ink-faint)" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#fa)"/>

    <!-- classify -->
    <rect x="30" y="170" width="200" height="42" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1.5"/>
    <text x="130" y="195" text-anchor="middle" font-size="11.5" fill="var(--ink)">Classify request</text>
    <line x1="230" y1="191" x2="268" y2="191" stroke="var(--ink-muted)" stroke-width="1.5" marker-end="url(#fa)"/>

    <!-- decision diamond -->
    <polygon points="330,155 392,191 330,227 268,191" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="330" y="187" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--accent-ink)">Risk</text>
    <text x="330" y="200" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--accent-ink)">tier?</text>
    <text x="150" y="243" font-size="9" fill="var(--ink-faint)" font-style="italic">ambiguous or classifier down defaults to Tier 2</text>

    <!-- Tier 1 branch -->
    <line x1="392" y1="180" x2="430" y2="160" stroke="var(--good)" stroke-width="1.5" marker-end="url(#fg)"/>
    <text x="393" y="152" font-size="8.5" fill="var(--good)">low risk</text>
    <rect x="430" y="140" width="260" height="42" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
    <text x="442" y="157" font-size="9.5" font-weight="700" fill="var(--good)">TIER 1</text>
    <text x="442" y="172" font-size="10.5" fill="var(--ink)">Auto-approve, no wait</text>

    <!-- Tier 2 branch -->
    <line x1="392" y1="202" x2="430" y2="225" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#fw)"/>
    <text x="393" y="222" font-size="8.5" fill="var(--warn)">medium risk</text>
    <rect x="430" y="205" width="260" height="42" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
    <text x="442" y="222" font-size="9.5" font-weight="700" fill="var(--warn)">TIER 2</text>
    <text x="442" y="237" font-size="10.5" fill="var(--ink)">Auto-approve, logged for sample</text>

    <!-- Tier 2 -> async sample QA -->
    <path d="M 480 247 V 290 H 145 V 328" fill="none" stroke="var(--warn)" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#fw)"/>
    <rect x="35" y="380" width="230" height="50" rx="6" fill="none" stroke="var(--warn)" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="150" y="400" text-anchor="middle" font-size="10" fill="var(--ink-muted)">Periodic sample review</text>
    <text x="150" y="414" text-anchor="middle" font-size="8.5" fill="var(--ink-faint)">async, doesn't block approval</text>

    <!-- Tier 3 branch: down into review column -->
    <text x="205" y="221" font-size="8.5" fill="var(--crit)">high risk</text>
    <path d="M 330 227 V 300 H 380 V 328" fill="none" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#fc)"/>

    <rect x="310" y="380" width="150" height="42" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
    <text x="322" y="397" font-size="9.5" font-weight="700" fill="var(--crit)">TIER 3</text>
    <text x="322" y="412" font-size="10" fill="var(--ink)">Escalated</text>

    <line x1="460" y1="401" x2="490" y2="401" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#fc)"/>
    <rect x="490" y="380" width="150" height="42" rx="6" fill="var(--surface)" stroke="var(--crit)" stroke-width="1.5"/>
    <text x="565" y="398" text-anchor="middle" font-size="9.5" fill="var(--ink)">Attach reasoning</text>
    <text x="565" y="411" text-anchor="middle" font-size="9.5" fill="var(--ink)">+ audit trail, enqueue</text>

    <line x1="640" y1="401" x2="670" y2="401" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#fc)"/>

    <!-- external: MRGR reviews -->
    <rect x="670" y="380" width="150" height="42" rx="6" fill="url(#hatch2)" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="670" y="380" width="150" height="42" rx="6" fill="var(--surface-2)" opacity="0.5"/>
    <text x="745" y="405" text-anchor="middle" font-size="10.5" fill="var(--ink)">MRGR reviews</text>

    <line x1="820" y1="401" x2="850" y2="401" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#fc)"/>
    <polygon points="895,371 940,401 895,431 850,401" fill="url(#hatch2)" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="895,371 940,401 895,431 850,401" fill="var(--crit-soft)" opacity="0.5"/>
    <text x="895" y="405" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--crit)">OK?</text>

    <!-- MRGR reject -->
    <path d="M 895 431 V 470 H 780" fill="none" stroke="var(--crit)" stroke-width="1.5" marker-end="url(#fc)"/>
    <text x="840" y="463" font-size="9" fill="var(--crit)">no</text>
    <rect x="580" y="452" width="200" height="42" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
    <text x="680" y="477" text-anchor="middle" font-size="10.5" fill="var(--ink)">Notify: rejected + reason</text>

    <!-- MRGR approve, routed along the right edge, no crossing -->
    <path d="M 940 401 H 1010 V 81 H 900" fill="none" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#fg)"/>
    <text x="1015" y="240" font-size="9" fill="var(--good)" transform="rotate(90 1015 240)" text-anchor="middle">yes</text>

    <!-- shared notify approved -->
    <rect x="690" y="60" width="190" height="42" rx="21" fill="var(--accent)"/>
    <text x="785" y="85" text-anchor="middle" font-size="11" fill="var(--surface)" font-weight="600">Notify: approved</text>

    <path d="M 690 161 V 100 H 760" fill="none" stroke="var(--good)" stroke-width="1.5" marker-end="url(#fg)"/>
    <path d="M 690 226 V 130 H 820" fill="none" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#fw)"/>

    <!-- legend -->
    <g transform="translate(30,550)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="none" stroke="var(--ink-faint)" stroke-dasharray="3,2"/>
      <text x="20" y="11" font-size="9.5" fill="var(--ink-muted)">Hatched / dashed = external system, not built here</text>
    </g>
  </svg>
</div>
