<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">ICB Trust Platform — Integration Architecture (black-box level)</text>

  <!-- Market Team -->
  <rect x="30" y="70" width="160" height="50" rx="6" fill="#e8eef7" stroke="#3b5998" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" font-size="13" fill="#1a1a2e">Market Launch Team</text>

  <!-- sync arrow -->
  <line x1="190" y1="85" x2="330" y2="85" stroke="#3b5998" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#3b5998">sync (reads)</text>

  <!-- async arrow -->
  <line x1="190" y1="110" x2="330" y2="145" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="135" text-anchor="middle" font-size="11" fill="#c0392b">async (writes)</text>

  <!-- Platform API -->
  <rect x="330" y="65" width="220" height="55" rx="6" fill="#1a1a2e"/>
  <text x="440" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Platform API — versioned contract</text>

  <!-- Event Bus -->
  <rect x="330" y="140" width="220" height="45" rx="6" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
  <text x="440" y="168" text-anchor="middle" font-size="12" fill="#c0392b">Event Bus (fan-out)</text>

  <!-- three downstream boxes -->
  <rect x="600" y="70" width="130" height="45" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="665" y="96" text-anchor="middle" font-size="12" fill="#1a1a2e">CDP</text>

  <rect x="600" y="140" width="130" height="45" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="665" y="166" text-anchor="middle" font-size="12" fill="#1a1a2e">Communications</text>

  <rect x="600" y="210" width="130" height="45" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="665" y="236" text-anchor="middle" font-size="12" fill="#1a1a2e">CMS</text>

  <line x1="550" y1="160" x2="600" y2="92" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <line x1="550" y1="162" x2="600" y2="162" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#arrowg)"/>
  <line x1="550" y1="164" x2="600" y2="230" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#arrowg)"/>

  <!-- Consent Store — the deliberate sync exception -->
  <rect x="330" y="270" width="220" height="55" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2"/>
  <text x="440" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5200">Consent Store</text>
  <text x="440" y="310" text-anchor="middle" font-size="10" fill="#7a5200">sync write — single source of truth</text>

  <line x1="440" y1="120" x2="440" y2="270" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowo)"/>
  <text x="470" y="200" font-size="10" fill="#7a5200">deliberate exception</text>
  <text x="470" y="213" font-size="10" fill="#7a5200">to async-by-default</text>

  <!-- Governance Engine -->
  <rect x="330" y="360" width="220" height="55" rx="6" fill="#f0eefc" stroke="#5b3fa0" stroke-width="1.5"/>
  <text x="440" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#3d2a6b">AI Governance &amp; Policy Engine</text>
  <text x="440" y="400" text-anchor="middle" font-size="10" fill="#3d2a6b">called on demand — not inline</text>

  <line x1="600" y1="380" x2="550" y2="387" stroke="#5b3fa0" stroke-width="1.2"/>
  <line x1="230" y1="380" x2="330" y2="387" stroke="#5b3fa0" stroke-width="1.2" marker-end="url(#arrowp)"/>
  <text x="110" y="375" text-anchor="middle" font-size="11" fill="#5b3fa0">Market team calls</text>
  <text x="110" y="388" text-anchor="middle" font-size="11" fill="#5b3fa0">for risk tier</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b5998"/></marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="arrowo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b8860b"/></marker>
    <marker id="arrowp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b3fa0"/></marker>
  </defs>

  <text x="450" y="455" text-anchor="middle" font-size="10" fill="#666">Illustrative black-box architecture — not a claim about JPMC's actual implementation.</text>
</svg>
